name: rust
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM64 (Apple Silicon): ARM64 Linux and Windows, and
        # Intel macOS, complete the targets of ADR-0003. Standard hosted runners,
        # free for public repositories.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm, windows-11-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; update by reviewed PR
        with:
          persist-credentials: false
      # The workspace includes the Tauri shell, which needs WebKitGTK on Linux.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        # A stalled mirror must fail fast and be retried, not consume the job timeout.
        timeout-minutes: 10
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # Standard hosted runners only (free for public repositories). They ship
      # rustup; rust-toolchain.toml selects the exact version.
      # Some images (Windows on ARM) may not ship rustup: installed if missing.
      - name: Install rustup if missing
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            case "$RUNNER_OS" in
              Windows)
                curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
                "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
                ;;
              *)
                curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
                ;;
            esac
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Only main writes the cache, so a pull request cannot poison it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3; update by reviewed PR
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # Required: licenses, bans and sources only change with our own Cargo.lock.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; update by reviewed PR
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1; update by reviewed PR
        with:
          command: check bans licenses sources
