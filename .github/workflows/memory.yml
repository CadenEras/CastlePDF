name: memory
# Indicative memory, idle and with a document open, on shared hosted runners. Not a reference
# measurement (see docs/PERFORMANCE.md); run manually when needed.
on:
  # Not a required check: the path filter only re-validates the harness itself.
  pull_request:
    paths:
      - scripts/measure-memory.mjs
      - .github/workflows/memory.yml
  workflow_dispatch:
    inputs:
      runs:
        description: Number of successive starts
        default: "10"
      settle:
        description: Seconds between start and measurement
        default: "5"

permissions:
  contents: read

concurrency:
  group: memory-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24.16.0"

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; update by reviewed PR
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; update by reviewed PR
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri system dependencies and a virtual display
        if: runner.os == 'Linux'
        # A stalled mirror must fail fast and be retried, not consume the job timeout.
        timeout-minutes: 10
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3; update by reviewed PR
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release app without bundling
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri -- build --no-bundle -- --locked
      - name: Measure
        env:
          RUNS: ${{ inputs.runs || '10' }}
          SETTLE: ${{ inputs.settle || '5' }}
        run: |
          # Idle, then with a document of images and forms open.
          measure() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a node scripts/measure-memory.mjs "$RUNS" "$SETTLE" "$@"
            else
              node scripts/measure-memory.mjs "$RUNS" "$SETTLE" "$@"
            fi
          }
          { measure; echo; measure tests/corpus/public/forms.pdf; } | tee report.md
          {
            echo "## ${{ matrix.os }} (runner partagé, indicatif)"
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"
