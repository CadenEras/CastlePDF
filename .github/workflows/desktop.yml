name: desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24.16.0"

defaults:
  run:
    working-directory: apps/desktop

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; update by reviewed PR
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; update by reviewed PR
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  # Native release build of the shell and worker, without installers.
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM64 (Apple Silicon): ARM64 Linux and Windows, and
        # Intel macOS, complete the targets of ADR-0003. Standard hosted runners,
        # free for public repositories.
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm, windows-11-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; update by reviewed PR
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; update by reviewed PR
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        # A stalled mirror must fail fast and be retried, not consume the job timeout.
        timeout-minutes: 10
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # Some images (Windows on ARM) may not ship rustup: installed if missing.
      - name: Install rustup if missing
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            case "$RUNNER_OS" in
              Windows)
                curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
                "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
                ;;
              *)
                curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
                ;;
            esac
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Only main writes the cache, so a pull request cannot poison it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3; update by reviewed PR
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Build without bundling
        run: npm run tauri -- build --no-bundle -- --locked
