[package]
name = "pdf-render"
description = "PDF content stream interpretation and page rasterisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pdf-document.workspace = true
pdf-syntax.workspace = true
# Rasteriser (ADR-0003). Exact version: its 0.x API is wrapped by `raster.rs`
# only. No `png` (decoder) nor `text` (glyph stack) nor multithreading.
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
# JPEG (DCTDecode) images (ADR-0005). No default features: the SIMD paths
# (`x86`, `neon`) use `unsafe`; without them the crate forbids it.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[features]
default = ["standard-fonts", "cjk-cmaps"]
# Embeds the replacement fonts (crates/pdf-render/fonts, about 280 KB, SIL
# OFL 1.1) for fonts a PDF names but does not embed (ADR-0005).
standard-fonts = []
# Embeds 16 of Adobe's predefined CMaps (crates/pdf-render/cmaps, about 720 KiB,
# BSD-3-Clause): the CJK encodings met on the corpus and the UCS2 CMap of
# each CJK collection (ADR-0006, tranche 3.7b).
cjk-cmaps = []

[lints]
workspace = true
