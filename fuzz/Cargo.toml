# Fuzz targets (ADR-0002). A separate workspace on a dated nightly toolchain,
# never shipped and never part of the main workspace or its Cargo.lock.
[package]
name = "pdf-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pdf-document = { path = "../crates/pdf-document" }
pdf-render = { path = "../crates/pdf-render" }
pdf-syntax = { path = "../crates/pdf-syntax" }
pdf-worker = { path = "../crates/pdf-worker" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "objects"
path = "fuzz_targets/objects.rs"
test = false
doc = false
bench = false

